<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenhar a fazendinha (Geoman)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css">
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; }
    #info { position: absolute; z-index: 1000; bottom: 12px; left: 12px; right: 12px;
            background: #fff; padding: 8px 12px; border-radius: 8px; font: 15px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="info">Use os ícones à esquerda para desenhar a propriedade.</div>

  <!-- A ordem importa: Leaflet primeiro, depois o Geoman -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
  <script src="https://unpkg.com/@turf/turf@7.2.0/turf.min.js"></script>
  <script>
    // 1. Mapa e fundo (igual aos exemplos anteriores)
    const map = L.map('map').setView([-16.68, -49.25], 14);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // 2. O Geoman adiciona o objeto "pm" ao mapa. Aqui ligamos só o que precisamos.
    map.pm.setLang('pt_br');
    map.pm.addControls({
      position: 'topleft',
      drawPolygon: true, drawRectangle: true,
      editMode: true, removalMode: true,
      drawMarker: false, drawCircle: false, drawPolyline: false,
      drawCircleMarker: false, drawText: false,
      cutPolygon: false, rotateMode: false, dragMode: false
    });
    map.pm.setGlobalOptions({ pathOptions: { color: '#e3b64f', weight: 3 } });

    // 3. Lê a área desenhada e mostra um resumo
    let desenho = null;

    function lerArea(camada) {
		const poligono = camada.toGeoJSON();
		const centro = turf.centerOfMass(poligono);          // devolve um ponto [longitude, latitude]
		const [lng, lat] = centro.geometry.coordinates;
		document.getElementById('info').textContent =
			'Ponto médio: ' + lat.toFixed(5) + ', ' + lng.toFixed(5);
    }

    // 4. Eventos do Geoman
    map.on('pm:create', e => {                     // terminou de desenhar
      if (desenho) map.removeLayer(desenho);       // mantém uma área só
      desenho = e.layer;
      desenho.on('pm:edit', () => lerArea(desenho)); // arrastou um vértice
      lerArea(desenho);
    });
    map.on('pm:remove', () => {                     // apagou com a lixeira
      desenho = null;
      document.getElementById('info').textContent = 'Use os ícones à esquerda para desenhar a propriedade.';
    });
  </script>
</body>
</html>
