<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenhar a fazendinha (Geoman)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css">
  <style>
	html, body { height: 100%; margin: 0; }
	#map { height: 100%; }
	#info { position: absolute; z-index: 1000; bottom: 12px; left: 12px; right: 12px;
			background: #fff; padding: 8px 12px; border-radius: 8px; font: 15px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="info">Use os ícones à esquerda para desenhar a propriedade.</div>

  <!-- A ordem importa: Leaflet primeiro, depois o Geoman -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
  <script src="https://unpkg.com/@turf/turf@7.2.0/turf.min.js"></script>
  <script>
	const DEFAULT_MESSAGE = 'Use the icons on top left corner to edit the area';
    const infoBox = document.getElementById('info');

	// 1. Mapa e fundo (igual aos exemplos anteriores)
	const map = L.map('map').setView([-16.68, -49.25], 14);
	L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
	}).addTo(map);

	// 2. O Geoman adiciona o objeto "pm" ao mapa. Aqui ligamos só o que precisamos.
	map.pm.addControls({
		position: 'topleft',
		drawPolygon: true, drawRectangle: true,
		editMode: true, removalMode: true,
		drawMarker: true, drawCircle: true, drawPolyline: false,
		drawCircleMarker: false, drawText: false,
		cutPolygon: false, rotateMode: false, dragMode: true
	});
	map.pm.setGlobalOptions({ pathOptions: { color: '#26a122', weight: 3 } });

	const placeCache = {};

    async function getPlaceName(lat, lng) {
		const key = lat.toFixed(3) + ',' + lng.toFixed(3);
		if (placeCache[key]) return placeCache[key];

		const url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10'
				+ '&accept-language=en&lat=' + lat + '&lon=' + lng;
		const response = await fetch(url);
		if (!response.ok) throw new Error('HTTP ' + response.status);

		const address = (await response.json()).address || {};
		// The city name can come in different fields depending on the place
		const city = address.city || address.town || address.village
				|| address.municipality || address.county || 'Unknown place';
		return placeCache[key] = city + (address.state ? ' - ' + address.state : '');
    }

	// 3. Lê a área desenhada e mostra um resumo
	async function readArea(layer) {
		const polygon = layer.toGeoJSON();
		// Turf returns [longitude, latitude], the opposite order of Leaflet
		const [lng, lat] = turf.centerOfMass(polygon).geometry.coordinates;

		infoBox.innerHTML = 'Center: ' + lat.toFixed(5) + ', ' + lng.toFixed(5) + '<br>';
		try {
			infoBox.innerHTML += await getPlaceName(lat, lng);
		} catch (error) {
			infoBox.innerHTML = 'Unable to find the city. Center: '
								+ lat.toFixed(5) + ', ' + lng.toFixed(5);
		}
	}

	let drawnLayer = null;

	// 4. Eventos do Geoman
	map.on('pm:create', e => {                     // terminou de desenhar
		if (drawnLayer) map.removeLayer(drawnLayer);       // mantém uma área só
		drawnLayer = e.layer;
		drawnLayer.on('pm:edit', () => readArea(drawnLayer));      // vertex dragged
    	drawnLayer.on('pm:dragend', () => readArea(drawnLayer));   // whole shape moved
		readArea(drawnLayer);
	});
	map.on('pm:remove', () => {                     // apagou com a lixeira
		drawnLayer = null;
		infoBox.textContent = DEFAULT_MESSAGE;
	});
  </script>
</body>
</html>
