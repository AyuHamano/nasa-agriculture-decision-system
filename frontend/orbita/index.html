<!doctype html>
<!-- Gerado com IA (Claude). A tela do produtor do Órbita Rural (Equipe Agronautas, NASA Space Apps 2026).
     Abre com dois cliques, sem servidor e sem internet. Os textos estão em js/textos.js; os dados, em dados/. -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Conte o que você planta e onde: o Órbita Rural compara a sua rotação com outras, com o que os satélites da NASA viram na sua região.">
  <title>Órbita Rural</title>
  <link rel="icon" href="marca/simbolo-verde.png">
  <!-- A página fica escondida até o app.js montar a tela, para não aparecer vazia e pular. Se algo falhar, ela aparece sozinha. -->
  <script>document.documentElement.classList.add("montando"); setTimeout(function () { document.documentElement.classList.remove("montando"); }, 2000);</script>
  <link rel="stylesheet" href="styles.css">
  <!-- Os dados e os programas carregam antes do corpo, para a tela aparecer já montada (sem pular ao abrir).
       Nenhum deles mexe na página antes de ela estar lida: o app.js espera o DOMContentLoaded. -->
  <script src="dados/respostas.js"></script>
  <script src="dados/complementos.js"></script>
  <script src="dados/validacao.js"></script>
  <script src="dados/conversas.js"></script>
  <script src="js/textos.js"></script>
  <script src="js/textos-agronomo.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/adaptar.js"></script>
  <script src="js/resultado.js"></script>
  <script src="js/comparacao.js"></script>
  <script src="js/replay.js"></script>
  <script src="js/conversa.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <a class="pular" href="#conteudo">Ir para o conteúdo</a>

  <header class="topo">
    <a class="marca" href="index.html" aria-label="Órbita Rural, início">
      <img src="marca/logo-verde-sem-lema.png" width="546" height="220" alt="Órbita Rural">
    </a>
    <div class="leituras" role="tablist" id="leituras">
      <button role="tab" id="abaProdutor" aria-controls="leituraProdutor" aria-selected="true" data-leitura="produtor"></button>
      <button role="tab" id="abaAgronomo" aria-controls="leituraAgronomo" aria-selected="false" data-leitura="agronomo" tabindex="-1"></button>
    </div>
  </header>

  <div class="aviso-do-modo" id="avisoDoModo" role="status" hidden></div>
  <p class="so-leitor" id="anuncio" aria-live="polite"></p>

  <main id="conteudo">
    <!-- A leitura do produtor: os três momentos, a conversa e o resultado -->
    <section id="leituraProdutor" role="tabpanel" aria-labelledby="abaProdutor">
      <div class="abertura">
        <h1 data-t="abertura.titulo"></h1>
        <p data-t="abertura.texto"></p>
      </div>

      <div class="momentos" role="tablist" id="momentos"></div>
      <p class="para-a-prova" id="paraAProva" hidden><button type="button" data-acao="ir-replay"></button></p>

      <div class="bancada" id="painelDoMomento" role="tabpanel">
        <section class="conversa" aria-labelledby="tituloDaConversa">
          <header class="conversa-topo">
            <h2 id="tituloDaConversa" data-t="conversa.titulo"></h2>
            <span class="modo" id="modo"></span>
          </header>
          <div class="outras" id="outras" hidden></div>
          <ol class="falas" id="falas"></ol>
          <div class="compositor" id="compositor"></div>
        </section>

        <section class="mesa" id="mesa"></section>
      </div>

      <section class="palco" id="prova" aria-labelledby="tituloDoReplay"></section>
    </section>

    <!-- A leitura do agrônomo: como a conta foi feita -->
    <section id="leituraAgronomo" role="tabpanel" aria-labelledby="abaAgronomo" hidden></section>

    <section class="cooperativa">
      <h2 data-t="cooperativa.titulo"></h2>
      <p data-t="cooperativa.texto"></p>
    </section>
  </main>

  <footer class="rodape">
    <img src="marca/simbolo-verde.png" width="224" height="224" alt="">
    <div>
      <p class="lema" data-t="rodape.lema"></p>
      <p data-t="rodape.fontes"></p>
      <p data-t="rodape.ia"></p>
      <p data-t="rodape.time"></p>
    </div>
  </footer>

</body>
</html>
